name: 发版

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验语义化版本标签
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "标签 $RELEASE_TAG 不是有效的语义化版本" >&2
            exit 1
          fi

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 同步版本号
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: 运行测试
        run: npm test

      - name: 构建 Windows 安装包和便携版
        env:
          HOME: /tmp/electron-builder-home
          WINEPREFIX: /tmp/electron-builder-wine
        run: |
          mkdir -p "$HOME" "$WINEPREFIX"
          npm run dist:win

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.exe

  linux:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 同步版本号
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: 运行测试
        run: npm test

      - name: 构建 Linux AppImage 和 RPM
        run: npm run dist:linux

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.rpm
